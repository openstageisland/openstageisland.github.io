name: doctor-sync

# Calls THIS account's doctor. The previous version called neohiro/doctor, which
# is a private repo owned by a different account, so GitHub could not load the
# caller:
#
#     "neohiro/doctor/.github/workflows/reusable-doctor.yml@main":
#         workflow was not found
#
# That surfaced as a failed run with zero jobs and no logs, which is why this
# workflow had failed 116/116 times without ever revealing the cause.
#
# GitHub only permits calling a reusable workflow that is public, or private
# with caller access. openstageisland/doctor is private and owned by this org, so
# repositories here can call it. That is the reason each account keeps its own
# doctor instead of sharing one.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '42 5,14,22 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Structural checks. Reported, never auto-merged.
  stage-a:
    uses: openstageisland/doctor/.github/workflows/reusable-doctor.yml@main
    with:
      target_repo: ${{ github.repository }}
