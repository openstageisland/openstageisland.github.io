# This repository is PUBLIC. openstageisland/doctor is PRIVATE, and GitHub does
# not allow a public repository to call a private reusable workflow. The call
# fails as:
#
#     HTTP 422 ... error parsing called workflow
#
# which is reported as a failed run with ZERO jobs and no logs. That is why this
# workflow had no visible cause for so long.
#
# There is nothing to fix here and nothing to gain from calling out: the doctor
# scans every repository in this account from its own scheduled run, which is
# private-to-private and works. That scheduled scan is the mechanism that fixes
# CI errors unattended; this file only ever added a duplicate trigger.
#
# If per-PR feedback is wanted later, the doctor must be made public. That is a
# deliberate visibility decision, not a config change.
on:
  schedule:
    - cron: '42 5,14,22 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doctor-report:
    # Private -> private: resolves, self-tests, then scans the whole account.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: openstageisland/doctor
          ref: main
          path: doctor
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove the doctor works before trusting it
        working-directory: doctor
        run: |
          python -m pip install --quiet --disable-pip-version-check pyyaml pytest
          python -m pytest tests/ -q

      - name: Diagnose this repository
        working-directory: doctor
        run: python tools/ci_doctor.py --repo "$GITHUB_WORKSPACE" --json