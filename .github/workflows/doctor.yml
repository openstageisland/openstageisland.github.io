name: doctor-sync

# Calls THIS account's doctor. Previously this called neohiro/doctor, which is a
# private repo owned by a different account, so GitHub refused to load it:
#
#     "neohiro/doctor/.github/workflows/reusable-doctor.yml@main":
#         workflow was not found
#
# GitHub only permits calling a reusable workflow that is public, or private
# with caller access. openstageisland/doctor is private and owned by this org, so
# repos here can call it. ci_doctor check RP003 flags the old arrangement.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '42 5,14,22 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs whenever a relevant path changes, or on a schedule/dispatch.
  stage-a:
    uses: openstageisland/doctor/.github/workflows/reusable-doctor.yml@main
    with:
      target_repo: ${{ github.repository }}

  # Full profile: adds the shell/workflow-lint and cross-repo stages.
  stage-c:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: openstageisland/doctor/.github/workflows/reusable-doctor.yml@main
    with:
      target_repo: ${{ github.repository }}
      fix: true