name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate source files exist
        run: |
          set -euo pipefail
          required=(index.md _config.yml Gemfile assets/style.css data.json README.md)
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Missing required source file"
              exit 1
            fi
            echo "✓ $f exists"
          done

      - name: Validate front matter in Markdown source
        run: |
          set -euo pipefail
          failures=0
          for f in *.md destinations.md README.md; do
            [ -f "$f" ] || continue
            if ! grep -q "^---$" "$f"; then
              echo "::error file=$f::Missing Jekyll front matter"
              failures=$((failures+1))
            else
              echo "✓ $f front matter present"
            fi
          done
          [ "$failures" -eq 0 ] || { echo "$failures file(s) missing front matter"; exit 1; }

      - name: Validate JSON
        run: |
          set -euo pipefail
          for f in data.json; do
            [ -f "$f" ] || continue
            python3 -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8')); print('valid: ' + sys.argv[1])" "$f"
          done

      - name: Validate _config.yml
        run: |
          set -euo pipefail
          python3 -c "
import sys, yaml
try:
    with open('_config.yml', encoding='utf-8') as f:
        c = yaml.safe_load(f)
    for k in ('url', 'github_username'):
        if k not in c:
            print(f'::error::Missing required key: {k}')
            sys.exit(1)
    print(f'url: {c[\"url\"]}')
    print(f'github_username: {c[\"github_username\"]}')
    print('valid _config.yml')
except Exception as e:
    print(f'::error::YAML parse error: {e}')
    sys.exit(1)
" 2>&1 || { echo "YAML validation failed"; exit 1; }

      - name: Set up Ruby and Jekyll
        run: |
          set -euo pipefail
          ruby_version=$(grep -oP 'ruby "\K[^"]+' Gemfile 2>/dev/null || echo "3.3.0")
          echo "Installing Ruby ${ruby_version}..."
          # Install bundler and gems
          gem install bundler --no-document
          bundle install --jobs=4 --retry=3

      - name: Build site
        run: bundle exec jekyll build --trace 2>&1

      - name: Validate generated HTML
        run: |
          set -euo pipefail
          failures=0
          for f in _site/**/*.html _site/*.html; do
            [ -f "$f" ] || continue
            ok=1
            if ! grep -qi "<!doctype html>" "$f"; then
              echo "::error file=$f::Missing <!DOCTYPE html>"
              ok=0
            fi
            if ! grep -q '<html[^>]*\blang=' "$f"; then
              echo "::error file=$f::Missing <html lang=...>"
              ok=0
            fi
            if ! grep -q '<title>[^<]+</title>' "$f"; then
              echo "::error file=$f::Missing or empty <title>"
              ok=0
            fi
            if ! grep -q 'name="description"' "$f"; then
              echo "::error file=$f::Missing meta description"
              ok=0
            fi
            # Section balance check
            open=$(grep -c '<section\b' "$f" 2>/dev/null || echo 0)
            close=$(grep -c '</section>' "$f" 2>/dev/null || echo 0)
            if [ "$open" -ne "$close" ]; then
              echo "::error file=$f::Unbalanced <section> tags ($open open vs $close close)"
              ok=0
            fi
            if [ "$ok" -eq 1 ]; then
              echo "✓ $f passed structural checks"
            else
              failures=$((failures+1))
            fi
          done
          [ "$failures" -eq 0 ] || { echo "$failures HTML file(s) failed"; exit 1; }

      - name: Validate local asset references in generated HTML
        run: |
          set -euo pipefail
          # For every src/href in generated HTML, verify local paths resolve
          warnings=0
          while IFS= read -r ref; do
            clean="${ref%%#*}"
            clean="${clean%%\?*}"
            clean="${clean//\"/}"
            [ -n "$clean" ] || continue
            # Skip absolute URLs and special schemes
            [[ "$clean" =~ ^https?:// ]] && continue
            [[ "$clean" =~ ^// ]] && continue
            [[ "$clean" =~ ^secondlife:// ]] && continue
            [[ "$clean" =~ ^mailto: ]] && continue
            [[ "$clean" =~ ^data: ]] && continue
            [[ "$clean" =~ ^# ]] && continue
            [[ "$clean" =~ ^/ ]] && continue
            [[ -z "$clean" ]] && continue
            if [ ! -f "_site/$clean" ] && [ ! -d "_site/$clean" ]; then
              echo "::warning file=_site/$clean::Broken local reference in site: $ref -> '$clean'"
              warnings=$((warnings+1))
            fi
          done < <(grep -rhoE '(href|src)="[^"]*"' _site/ | sed -E 's/^(href|src)="//; s/"$//' | sort -u)
          echo "Local reference check complete: $warnings warning(s)"
          # Fail only on real broken refs (not minor)
          # Emit a summary even if warnings exist so CI is informative

  deploy:
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Ruby and Jekyll
        run: |
          gem install bundler --no-document
          bundle install --jobs=4 --retry=3

      - name: Build site
        run: bundle exec jekyll build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
