name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate source files exist
        run: |
          set -euo pipefail
          required=(index.md _config.yml Gemfile assets/style.css data.json README.md)
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Missing required source file"
              exit 1
            fi
            echo "✓ $f exists"
          done

      - name: Validate front matter in Markdown source
        run: |
          set -euo pipefail
          failures=0
          for f in *.md destinations.md README.md; do
            [ -f "$f" ] || continue
            if ! grep -q "^---$" "$f"; then
              echo "::error file=$f::Missing Jekyll front matter"
              failures=$((failures+1))
            else
              echo "✓ $f front matter present"
            fi
          done
          [ "$failures" -eq 0 ] || { echo "$failures file(s) missing front matter"; exit 1; }

      - name: Validate JSON
        run: |
          set -euo pipefail
          for f in data.json; do
            [ -f "$f" ] || continue
            python3 -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8')); print('valid: ' + sys.argv[1])" "$f"
          done

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Unit tests (section-nav scroll animation)
        # Glob rather than a bare `tests/` directory: directory arguments to
        # `node --test` are not portable across Node 20-24.
        run: node --test tests/*.test.js

      - name: Validate workflow definitions
        # A workflow whose YAML does not parse cannot be loaded by GitHub at all:
        # the run is reported as failed with zero jobs and no logs. ci.yml was
        # itself unloadable for exactly that reason, so this gate could not live
        # only in ci.yml. Runs first and fails fast.
        run: |
          # --no-network keeps this gate deterministic and credential-free: it
          # validates only this repo's files. Cross-repo reusable-workflow
          # resolution (archived deps, missing workflow_call) needs `gh` and is
          # run manually via `python3 scripts/check-workflows.py`.
          python3 scripts/check-workflows.py --no-network

      - name: Validate _config.yml
        run: python3 scripts/check-config.py _config.yml

      - name: Set up Ruby and Jekyll
        # Replaces a hand-rolled `gem install bundler`, which fails on
        # ubuntu-24.04 with Gem::FilePermissionError: the runner's system gem
        # directory (/var/lib/gems/3.2.0) is not writable, so setup never
        # completed and the build step was skipped. setup-ruby provisions a
        # user-writable Ruby and `bundler-cache` runs bundle install for us.
        # Same change as the other openstageisland ci fix; needed here so this
        # branch's build can actually run and be verified.
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --trace 2>&1

      # Publish the rendered site even when a later validation step fails.
      # Without this, a failure in the HTML checks is undiagnosable: the
      # annotations only say which assertion failed, never what was rendered.
      - name: Upload rendered site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.run_number }}-${{ github.sha }}
          path: _site
          retention-days: 7
          if-no-files-found: error

      - name: Validate generated HTML
        # Replaces grep-based assertions such as
        #   grep -q '<title>[^<]+</title>' "$f"
        # which reported every page as "Missing or empty <title>" despite the
        # rendered pages all carrying a title. Byte-oriented grep over HTML is
        # fragile - multi-byte characters, entities and the `+` quantifier after
        # a negated class all change the result without changing the document.
        # Parsing does not have that failure mode.
        run: python3 scripts/check-html.py _site

      - name: Validate local asset references in generated HTML
        run: |
          set -euo pipefail
          # For every src/href in generated HTML, verify local paths resolve
          warnings=0
          while IFS= read -r ref; do
            clean="${ref%%#*}"
            clean="${clean%%\?*}"
            clean="${clean//\"/}"
            [ -n "$clean" ] || continue
            # Skip absolute URLs and special schemes
            [[ "$clean" =~ ^https?:// ]] && continue
            [[ "$clean" =~ ^// ]] && continue
            [[ "$clean" =~ ^secondlife:// ]] && continue
            [[ "$clean" =~ ^mailto: ]] && continue
            [[ "$clean" =~ ^data: ]] && continue
            [[ "$clean" =~ ^# ]] && continue
            [[ "$clean" =~ ^/ ]] && continue
            [[ -z "$clean" ]] && continue
            if [ ! -f "_site/$clean" ] && [ ! -d "_site/$clean" ]; then
              echo "::warning file=_site/$clean::Broken local reference in site: $ref -> '$clean'"
              warnings=$((warnings+1))
            fi
          done < <(grep -rhoE '(href|src)="[^"]*"' _site/ | sed -E 's/^(href|src)="//; s/"$//' | sort -u)
          echo "Local reference check complete: $warnings warning(s)"
          # Fail only on real broken refs (not minor)
          # Emit a summary even if warnings exist so CI is informative

  deploy:
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Ruby and Jekyll
        run: |
          gem install bundler --no-document
          bundle install --jobs=4 --retry=3

      - name: Build site
        run: bundle exec jekyll build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
