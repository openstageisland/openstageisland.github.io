name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate source files exist
        run: |
          set -euo pipefail
          required=(index.md _config.yml Gemfile assets/style.css data.json README.md)
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Missing required source file"
              exit 1
            fi
            echo "✓ $f exists"
          done

      - name: Validate front matter in Markdown source
        run: |
          set -euo pipefail
          failures=0
          for f in *.md destinations.md README.md; do
            [ -f "$f" ] || continue
            if ! grep -q "^---$" "$f"; then
              echo "::error file=$f::Missing Jekyll front matter"
              failures=$((failures+1))
            else
              echo "✓ $f front matter present"
            fi
          done
          [ "$failures" -eq 0 ] || { echo "$failures file(s) missing front matter"; exit 1; }

      - name: Validate JSON
        run: |
          set -euo pipefail
          for f in data.json; do
            [ -f "$f" ] || continue
            python3 -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8')); print('valid: ' + sys.argv[1])" "$f"
          done

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Unit tests (section-nav scroll animation)
        # Glob rather than a bare `tests/` directory: directory arguments to
        # `node --test` are not portable across Node 20-24.
        run: node --test tests/*.test.js

      - name: Unit tests (CI gate scripts)
        # The gates below can only be exercised against a real build, so their
        # own logic is tested here against synthetic fixtures.
        run: |
          python3 .github/scripts/test_check_publish_artifacts.py
          python3 .github/scripts/test_check_rendered_html.py
          python3 .github/scripts/test_check_config.py

      - name: Validate _config.yml
        # Was an inline `python3 -c "..."` block whose Python sat at column 0
        # inside this `run: |` scalar. That terminated the block and made the
        # whole workflow file invalid YAML, so ci.yml never ran at all.
        run: python3 .github/scripts/check_config.py --config _config.yml

      - name: Set up Ruby and Jekyll
        run: |
          set -euo pipefail
          ruby_version=$(grep -oP 'ruby "\K[^"]+' Gemfile 2>/dev/null || echo "3.3.0")
          echo "Installing Ruby ${ruby_version}..."
          # Install bundler and gems
          gem install bundler --no-document
          bundle install --jobs=4 --retry=3

      - name: Build site
        run: bundle exec jekyll build --trace 2>&1

      - name: Validate generated HTML
        # Replaces an inline grep pipeline. The same basics are still checked
        # (doctype, lang, title, description, balanced <section>) and are now
        # joined by rules that need real rendered output: unrendered Liquid,
        # duplicate ids, dangling #anchors, and heading structure.
        run: python3 .github/scripts/check_rendered_html.py --site _site

      - name: Validate published artifacts
        # _config.yml's exclude: list is the only thing keeping working files
        # out of the public site, and it fails silently. This asserts the
        # exclusion actually took effect.
        run: python3 .github/scripts/check_publish_artifacts.py --site _site --config _config.yml

      - name: Validate local asset references in generated HTML
        run: |
          set -euo pipefail
          # For every src/href in generated HTML, verify local paths resolve
          warnings=0
          while IFS= read -r ref; do
            clean="${ref%%#*}"
            clean="${clean%%\?*}"
            clean="${clean//\"/}"
            [ -n "$clean" ] || continue
            # Skip absolute URLs and special schemes
            [[ "$clean" =~ ^https?:// ]] && continue
            [[ "$clean" =~ ^// ]] && continue
            [[ "$clean" =~ ^secondlife:// ]] && continue
            [[ "$clean" =~ ^mailto: ]] && continue
            [[ "$clean" =~ ^data: ]] && continue
            [[ "$clean" =~ ^# ]] && continue
            [[ "$clean" =~ ^/ ]] && continue
            [[ -z "$clean" ]] && continue
            if [ ! -f "_site/$clean" ] && [ ! -d "_site/$clean" ]; then
              echo "::warning file=_site/$clean::Broken local reference in site: $ref -> '$clean'"
              warnings=$((warnings+1))
            fi
          done < <(grep -rhoE '(href|src)="[^"]*"' _site/ | sed -E 's/^(href|src)="//; s/"$//' | sort -u)
          echo "Local reference check complete: $warnings warning(s)"
          # Fail only on real broken refs (not minor)
          # Emit a summary even if warnings exist so CI is informative

  deploy:
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Ruby and Jekyll
        run: |
          gem install bundler --no-document
          bundle install --jobs=4 --retry=3

      - name: Build site
        run: bundle exec jekyll build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
