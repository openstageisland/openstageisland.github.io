name: Bug report
description: Report a reproducible bug or regression
labels: ["bug", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill in the sections below so we can
        reproduce and fix it quickly.

  - type: input
    id: sl-version
    attributes:
      label: Second Life viewer version
      description: "e.g. 7.x.x, Firestorm, etc."
      placeholder: "7.1.2"
    validations:
      required: true

  - type: input
    id: region
    attributes:
      label: Region / parcel
      description: "Where did the issue occur? (e.g. Derwent, specific coordinates)"
      placeholder: "Derwent / 248, 128, 22"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Your operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: "What did you do, step by step?"
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: "Paste any error messages, crash logs, or screenshot URLs."
      render: shell
